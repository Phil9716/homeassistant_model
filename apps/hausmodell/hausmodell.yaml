hausmodell:
  module: waermemodell
  class: Hausmodell
  raumtemperatur:
    - sensor.temperatur_wohnzimmer_temperature
    - sensor.temperatur_kuche_temperature
    - sensor.temperatur_badezimmer_temperature
  aussentemperatur: sensor.heating_vhp_broadcast_outsidetemp
  pv_leistung: sensor.wechselrichter_master_pv_erzeugung_summe
  vorlauf: sensor.heizkreis_unten_vorlauf
  bad_temperatur: sensor.temperatur_badezimmer_temperature
  wp_leistung: sensor.home_device_0_arotherm_plus_current_power   # W, myVaillant (eBUS liefert 0)
  wp_laeuft_ab_w: 200
  wetter: weather.baesweiler
  komfort_min: 20.5
  komfort_soll: 21.5
  lern_tage: 21
  speicher: /config/hausmodell_state.json
  heizkreise:
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk1, durchfluss: input_number.durchfluss_fbh_unten_hk1}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk2, durchfluss: input_number.durchfluss_fbh_unten_hk2}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk3, durchfluss: input_number.durchfluss_fbh_unten_hk3}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk4, durchfluss: input_number.durchfluss_fbh_unten_hk4}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk5, durchfluss: input_number.durchfluss_fbh_unten_hk5}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk6, durchfluss: input_number.durchfluss_fbh_unten_hk6}
    - {ruecklauf: sensor.heizkreis_unten_r_cklauf_hk7, durchfluss: input_number.durchfluss_fbh_unten_hk7}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk1, durchfluss: input_number.durchfluss_fbh_oben_hk1}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk2, durchfluss: input_number.durchfluss_fbh_oben_hk2}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk3, durchfluss: input_number.durchfluss_fbh_oben_hk3}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk4, durchfluss: input_number.durchfluss_fbh_oben_hk4}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk5, durchfluss: input_number.durchfluss_fbh_oben_hk5}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk6, durchfluss: input_number.durchfluss_fbh_oben_hk6}
    - {ruecklauf: sensor.heizkreisverteiler_oben_r_cklauf_hk7, durchfluss: input_number.durchfluss_fbh_oben_hk7}

hausmodell_updater:
  module: updater
  class: Updater
  dateien: [waermemodell.py, wpmodell.py, optimierer.py, prognose.py, updater.py, hausmodell.yaml]

wpmodell:
  module: wpmodell
  class: WPModell
  leistung_elektrisch: sensor.heating_vhp_hmu_currentconsumedpower
  leistung_thermisch: sensor.heating_vhp_hmu_currentyieldpower
  vorlauf: sensor.heating_vhp_hmu_flowtemp
  aussentemperatur: sensor.heating_vhp_broadcast_outsidetemp
  max_vorlauf_heizen: 45
  lern_tage: 30
  speicher: /config/wpmodell_state.json
  leistung_elektrisch_ersatz: sensor.home_device_0_arotherm_plus_current_power
  leistung_thermisch_ersatz: sensor.hausmodell_heizleistung
  ebus_abfragen:
    - vhp/hmu/CurrentConsumedPower/get
    - vhp/hmu/CurrentYieldPower/get
    - vhp/hmu/BuildingCircuitFlow/get
    - vhp/hmu/FlowTemp/get

optimierer:
  module: optimierer
  class: Optimierer
  strompreis: 0.30              # €/kWh, fest; Einspeisung wird mit 0 bewertet
  akku_nutzbar_kwh: 7.6         # gemessen: 49 % SoC lieferten nachts 3,7 kWh
  akku_leistung_kw: 5.0
  akku_eta_laden: 0.95          # zusammen ~0,80 hin und zurück (Gesamtzähler 1996/1603 kWh)
  akku_eta_entladen: 0.85
  heizleistung_max_kw: 8.0
  strafe_kalt_eur_kh: 0.3       # €/(K·h) unter Komfort – verhindert Netzheizen bei unsicherem Modell
  lernmodell_max_fehler_k: 0.5  # gelerntes Modell erst ab dieser Güte für die Planung
  t_min_tag: 21.0               # Leiträume 06–22 Uhr
  t_min_nacht: 20.5
  t_max: 23.5
  tag_von: 6
  tag_bis: 22
  vorlauf_plan: 33              # Vorlauf für die COP-Abschätzung
  einschalt_schwelle_kw: 1.5
  mindestlaufzeit_min: 60
  mindestpause_min: 30
  einschalt_ueberschuss_w: 1500  # EIN nur bei gemessenem PV-Überschuss (Mittel 10 min) …
  komfort_notfall_k: 1.5        # … oder wenn ein Leitraum so weit unter dem Minimum liegt
  fbh_kw_pro_k: 1.0             # gemessen 19.10.: ~9 kW bei 36 °C Vorlauf / ~27 °C Estrich
  entitaeten:
    automatik: input_boolean.optimierer_automatik
    pv_boost_automatik: input_boolean.pv_boost_automatik
    pv_boost_aktiv: input_boolean.pv_boost_aktiv
    betriebsart: select.wp_betriebsart_lokal
    max_vorlauf: number.wp_max_vorlauf_lokal
    min_vorlauf: number.wp_mindest_vorlauf_lokal
    ebus_ok: binary_sensor.ebus_daten_aktuell
    ueberschuss: sensor.pv_uberschuss_ohne_wp
    raum_min: sensor.leitraum_temperatur_minimum
    nicht_aus_bis: input_datetime.optimierer_nicht_aus_bis
    akku_soc: sensor.batteries_batterieladung
    aussen: sensor.heating_vhp_broadcast_outsidetemp
    wetter: weather.baesweiler
    verbrauch: sensor.verbrauch
  pv_prognose:
    - sensor.energy_production_today
    - sensor.energy_production_today_2
    - sensor.energy_production_today_3
    - sensor.energy_production_tomorrow_ost
    - sensor.energy_production_tomorrow_west
    - sensor.energy_production_tomorrow_sued
    - sensor.energy_production_d2
    - sensor.energy_production_d2_2
    - sensor.energy_production_d2_3
  raeume:
    Wohnzimmer: sensor.temperatur_wohnzimmer_temperature
    Küche: sensor.temperatur_kuche_temperature
    Bad: sensor.temperatur_badezimmer_temperature
    Schlafzimmer: sensor.temperatur_schlafzimmer_temperature
    Kinderzimmer: sensor.temperatur_kinderzimmer_temperature
    Bad Keller: sensor.badezimmer_keller_temperature
    Flur: sensor.flur_philipp_bewegungsmelder_temperatur

prognose:
  module: prognose
  class: Prognose
  ordner: /config/prognose
  lern_tage: 14
  plan: sensor.optimierer_plan
  verbrauch: sensor.verbrauch
  wp_leistung: sensor.wp_leistung_elektrisch
  ist:
    pv_roh: sensor.wechselrichter_master_pv_erzeugung_summe
    raum: sensor.leitraum_temperatur_mittel
  raeume:
    Wohnzimmer: sensor.prognose_wohnzimmer
    Küche: sensor.prognose_kueche
    Bad: sensor.prognose_bad
    Schlafzimmer: sensor.prognose_schlafzimmer
    Kinderzimmer: sensor.prognose_kinderzimmer
    Bad Keller: sensor.prognose_bad_keller
    Flur: sensor.prognose_flur
